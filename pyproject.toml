[project]
name = "hello-portal"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0"]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.17.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
