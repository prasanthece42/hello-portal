name: Aegis release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: aegis-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: prasanthece42/aegis-platform/.github/workflows/python-web-release.yml@b4f46baa41dc250a88c86f63ecb0949d5f14af02
    with:
      app-id: hello-portal
      container-port: "8000"
      health-path: "/health"
